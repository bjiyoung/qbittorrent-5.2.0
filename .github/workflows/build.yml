name: Build qBittorrent

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Install Python and aqt
        run: |
          pip install aqtinstall
          aqt install-qt windows desktop 6.7.2 win64_msvc2019_64 -O C:\Qt

      - name: Install dependencies via vcpkg
        run: |
          C:\vcpkg\vcpkg install libtorrent:x64-windows-static
          C:\vcpkg\vcpkg install boost-system:x64-windows-static
          C:\vcpkg\vcpkg install openssl:x64-windows-static
          C:\vcpkg\vcpkg install zlib:x64-windows-static

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DQt6_DIR="C:\Qt\6.7.2\msvc2019_64\lib\cmake\Qt6" `
            -DCMAKE_TOOLCHAIN_FILE="C:\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qbittorrent-windows
          path: build/qbittorrent.exe
