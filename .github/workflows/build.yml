name: Build qBittorrent

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    env:
      boost_path: "${{ github.workspace }}/../boost"
      libtorrent_path: "${{ github.workspace }}/../libtorrent"
      vcpkg_path: "c:/vcpkg"
      libtorrent_version: "2.0.11"
      boost_major: "1"
      boost_minor: "90"
      boost_patch: "0"

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: |
          if ((Get-Command "ninja.exe" -ErrorAction SilentlyContinue) -eq $null) {
            choco install ninja
          }

      - name: Set vcpkg cache variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', (process.env.ACTIONS_CACHE_URL || ''));
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', (process.env.ACTIONS_RUNTIME_TOKEN || ''));

      - name: Install OpenSSL and ZLIB via vcpkg
        run: |
          New-Item -Force -ItemType File `
            -Path "${{ env.vcpkg_path }}/triplets_overlay/x64-windows-static-md-release.cmake"
          Add-Content `
            -Path "${{ env.vcpkg_path }}/triplets_overlay/x64-windows-static-md-release.cmake" `
            -Value @(
              "set(VCPKG_TARGET_ARCHITECTURE x64)",
              "set(VCPKG_LIBRARY_LINKAGE static)",
              "set(VCPKG_CRT_LINKAGE dynamic)",
              "set(VCPKG_BUILD_TYPE release)")
          $packages = `
            "boost-build:x64-windows-static-md-release",
            "openssl:x64-windows-static-md-release",
            "zlib:x64-windows-static-md-release"
          ${{ env.vcpkg_path }}/vcpkg.exe install `
            --binarysource="clear;x-gha,readwrite" `
            --clean-after-build `
            --overlay-triplets="${{ env.vcpkg_path }}/triplets_overlay" `
            $packages

      - name: Install Boost
        run: |
          $url = "https://archives.boost.io/release/${{ env.boost_major }}.${{ env.boost_minor }}.${{ env.boost_patch }}/source/boost_${{ env.boost_major }}_${{ env.boost_minor }}_${{ env.boost_patch }}.tar.gz"
          curl -L -o "${{ runner.temp }}/boost.tar.gz" $url
          tar -xf "${{ runner.temp }}/boost.tar.gz" -C "${{ github.workspace }}/.."
          Move-Item "${{ github.workspace }}/../boost_*" "${{ env.boost_path }}"
          cd "${{ env.boost_path }}"
          ${{ env.vcpkg_path }}/installed/x64-windows-static-md-release/tools/boost-build/b2.exe `
            stage toolset=msvc --stagedir=.\ --with-headers

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.2"
          arch: win64_msvc2022_64
          cache: true

      - name: Build libtorrent
        run: |
          git clone `
            --branch v${{ env.libtorrent_version }} `
            --depth 1 `
            --recurse-submodules `
            https://github.com/arvidn/libtorrent.git `
            ${{ env.libtorrent_path }}
          cd ${{ env.libtorrent_path }}
          cmake -B build -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_STANDARD=20 `
            -DCMAKE_INSTALL_PREFIX="${{ env.libtorrent_path }}/install" `
            -DCMAKE_TOOLCHAIN_FILE="${{ env.vcpkg_path }}/scripts/buildsystems/vcpkg.cmake" `
            -DBOOST_ROOT="${{ env.boost_path }}/lib/cmake" `
            -DBUILD_SHARED_LIBS=OFF `
            -Ddeprecated-functions=OFF `
            -Dstatic_runtime=OFF `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md-release
          cmake --build build
          cmake --install build

      - name: Build qBittorrent
        run: |
          cmake -B build -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="${{ env.vcpkg_path }}/scripts/buildsystems/vcpkg.cmake" `
            -DBOOST_ROOT="${{ env.boost_path }}/lib/cmake" `
            -DLibtorrentRasterbar_DIR="${{ env.libtorrent_path }}/install/lib/cmake/LibtorrentRasterbar" `
            -DMSVC_RUNTIME_DYNAMIC=ON `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md-release
          cmake --build build

      - name: Package artifacts
        run: |
          mkdir upload
          copy build\qbittorrent.exe upload\
          copy dist\windows\qt.conf upload\
          copy "${{ env.Qt_ROOT_DIR }}\bin\Qt6Core.dll" upload\
          copy "${{ env.Qt_ROOT_DIR }}\bin\Qt6Gui.dll" upload\
          copy "${{ env.Qt_ROOT_DIR }}\bin\Qt6Network.dll" upload\
          copy "${{ env.Qt_ROOT_DIR }}\bin\Qt6Sql.dll" upload\
          copy "${{ env.Qt_ROOT_DIR }}\bin\Qt6Svg.dll" upload\
          copy "${{ env.Qt_ROOT_DIR }}\bin\Qt6Widgets.dll" upload\
          copy "${{ env.Qt_ROOT_DIR }}\bin\Qt6Xml.dll" upload\
          mkdir upload\plugins\platforms
          copy "${{ env.Qt_ROOT_DIR }}\plugins\platforms\qwindows.dll" upload\plugins\platforms\
          mkdir upload\plugins\iconengines
          copy "${{ env.Qt_ROOT_DIR }}\plugins\iconengines\qsvgicon.dll" upload\plugins\iconengines\
          mkdir upload\plugins\tls
          copy "${{ env.Qt_ROOT_DIR }}\plugins\tls\qschannelbackend.dll" upload\plugins\tls\
          mkdir upload\plugins\sqldrivers
          copy "${{ env.Qt_ROOT_DIR }}\plugins\sqldrivers\qsqlite.dll" upload\plugins\sqldrivers\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qbittorrent-windows
          path: upload\
